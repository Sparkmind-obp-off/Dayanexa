name = "dayanexa-api"
main = "src/index.ts"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
PAYMENTS_MODE = "mock"
PAYMENT_LIVE_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "dayanexa-production"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

# Configure secrets with: wrangler secret put CLERK_JWT_KEY
# Provider secrets are server-side only. Never use VITE_ prefixes.
